name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    uses: daviekaranja/workflows/.github/workflows/nodejs/docker_build_push.yaml@master
    with:
      working_directory: "."                 # Optional: path to Node.js project
      node_version: "22"                     # Optional
      package_manager: "npm"                 # npm, yarn, or pnpm
      docker_image_name: "myusername/myapp" # Required
      docker_context: "."                     # Optional: docker build context
      docker_tags: "latest,${{ github.sha }}" # Optional: comma-separated tags
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
