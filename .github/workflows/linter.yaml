name: Build and Lint Frontend
on:
  push:
    branches:
      - master

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js with lockfile path for sub-directory caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      # 3. Install dependencies inside apps/frontend
      - name: Install dependencies
        run: npm ci

      # 4. Run ESLint (using apps/frontend/eslint.config.mjs)
      - name: Run ESLint
        run: npm run lint

      # 5. Build Next.js project to check for production/type errors
      - name: Run build
        run: npm run build